<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Dulce Tentación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-[#FFF9F5]">
  <div id="header-placeholder"></div>

  <section class="py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-8">Finalizar Compra</h1>

      <div id="checkout-content">
        <div class="grid lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
              <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span class="w-8 h-8 bg-pink-500 text-white rounded-full flex items-center justify-center text-sm font-bold">1</span>
                Dirección de Envío
              </h2>
              <form id="shipping-form" class="space-y-4">
                <div class="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
                    <input type="text" id="ship-name" required class="w-full px-4 py-2 rounded-lg border border-gray-200">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                    <input type="tel" id="ship-phone" required class="w-full px-4 py-2 rounded-lg border border-gray-200">
                  </div>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
                  <input type="text" id="ship-street" required placeholder="Calle, número exterior e interior" class="w-full px-4 py-2 rounded-lg border border-gray-200">
                </div>
                <div class="grid sm:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ciudad</label>
                    <input type="text" id="ship-city" required class="w-full px-4 py-2 rounded-lg border border-gray-200">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                    <input type="text" id="ship-state" required class="w-full px-4 py-2 rounded-lg border border-gray-200">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Código Postal</label>
                    <input type="text" id="ship-zip" required class="w-full px-4 py-2 rounded-lg border border-gray-200">
                  </div>
                </div>
              </form>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
              <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span class="w-8 h-8 bg-pink-500 text-white rounded-full flex items-center justify-center text-sm font-bold">2</span>
                Tipo de Envío
              </h2>
              <div class="space-y-3" id="shipping-methods"></div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
              <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span class="w-8 h-8 bg-pink-500 text-white rounded-full flex items-center justify-center text-sm font-bold">3</span>
                Medio de Pago
              </h2>
              <div class="space-y-3" id="payment-methods"></div>

              <div id="card-fields" class="mt-4 space-y-4 hidden">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Número de tarjeta</label>
                  <input type="text" placeholder="1234 5678 9012 3456" class="w-full px-4 py-2 rounded-lg border border-gray-200">
                </div>
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de expiración</label>
                    <input type="text" placeholder="MM/AA" class="w-full px-4 py-2 rounded-lg border border-gray-200">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
                    <input type="text" placeholder="123" class="w-full px-4 py-2 rounded-lg border border-gray-200">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 sticky top-20">
              <h3 class="font-bold text-gray-800 text-lg mb-4">Tu Pedido</h3>
              <div id="order-summary-items" class="space-y-3 mb-4 max-h-60 overflow-y-auto"></div>
              <div class="border-t border-gray-200 pt-4 space-y-2">
                <div class="flex justify-between text-gray-600">
                  <span>Subtotal</span>
                  <span id="summary-subtotal">$0.00</span>
                </div>
                <div class="flex justify-between text-gray-600">
                  <span>Envío</span>
                  <span id="summary-shipping">$0.00</span>
                </div>
                <div class="border-t border-gray-200 pt-2 flex justify-between font-bold text-lg text-gray-800">
                  <span>Total</span>
                  <span id="summary-total">$0.00</span>
                </div>
              </div>
              <button onclick="placeOrder()" class="btn-primary w-full mt-6 py-3 text-white rounded-lg font-semibold">
                Confirmar Compra
              </button>
              <p class="text-xs text-gray-500 text-center mt-3">Al confirmar aceptas nuestros <a href="terms.html" class="text-pink-500">términos y condiciones</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script>
    let selectedShipping = 'standard';
    let selectedPayment = 'card';

    document.addEventListener('DOMContentLoaded', () => {
      const items = Cart.getDetailedItems();
      if (items.length === 0) {
        navigateTo('cart.html');
        return;
      }

      const user = Auth.getCurrentUser();
      if (user) {
        $('#ship-name').value = user.name || '';
        $('#ship-phone').value = user.phone || '';
      }

      $('#shipping-methods').innerHTML = MOCK_DATA.shippingMethods.map(method => `
        <label class="flex items-center gap-4 p-4 rounded-xl border-2 cursor-pointer transition-colors ${method.id === selectedShipping ? 'border-pink-500 bg-pink-50' : 'border-gray-200 hover:border-pink-300'}">
          <input type="radio" name="shipping" value="${method.id}" ${method.id === selectedShipping ? 'checked' : ''} onchange="selectShipping('${method.id}')" class="text-pink-500">
          <span class="text-2xl">${method.icon}</span>
          <div class="flex-1">
            <p class="font-medium text-gray-800">${method.name}</p>
            <p class="text-sm text-gray-500">${method.description}</p>
          </div>
          <span class="font-bold text-gray-800">${method.price === 0 ? 'Gratis' : formatPrice(method.price)}</span>
        </label>
      `).join('');

      $('#payment-methods').innerHTML = MOCK_DATA.paymentMethods.map(method => `
        <label class="flex items-center gap-4 p-4 rounded-xl border-2 cursor-pointer transition-colors ${method.id === selectedPayment ? 'border-pink-500 bg-pink-50' : 'border-gray-200 hover:border-pink-300'}">
          <input type="radio" name="payment" value="${method.id}" ${method.id === selectedPayment ? 'checked' : ''} onchange="selectPayment('${method.id}')" class="text-pink-500">
          <span class="text-2xl">${method.icon}</span>
          <span class="font-medium text-gray-800">${method.name}</span>
        </label>
      `).join('');

      renderOrderSummary();
    });

    function renderOrderSummary() {
      const items = Cart.getDetailedItems();
      const subtotal = Cart.getSubtotal();
      const shippingMethod = MOCK_DATA.shippingMethods.find(m => m.id === selectedShipping);
      const shipping = shippingMethod ? shippingMethod.price : 0;
      const total = subtotal + shipping;

      $('#order-summary-items').innerHTML = items.map(item => `
        <div class="flex items-center gap-3">
          <img src="${item.product.image}" alt="${item.product.name}" class="w-12 h-12 rounded-lg object-cover">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-800 truncate">${item.product.name}</p>
            <p class="text-xs text-gray-500">x${item.quantity}</p>
          </div>
          <span class="text-sm font-medium text-gray-800">${formatPrice(item.product.price * item.quantity)}</span>
        </div>
      `).join('');

      $('#summary-subtotal').textContent = formatPrice(subtotal);
      $('#summary-shipping').textContent = shipping === 0 ? 'Gratis' : formatPrice(shipping);
      $('#summary-total').textContent = formatPrice(total);
    }

    function selectShipping(methodId) {
      selectedShipping = methodId;
      $$('#shipping-methods label').forEach(label => {
        const input = label.querySelector('input');
        label.classList.toggle('border-pink-500', input.value === methodId);
        label.classList.toggle('bg-pink-50', input.value === methodId);
        label.classList.toggle('border-gray-200', input.value !== methodId);
      });
      renderOrderSummary();
    }

    function selectPayment(methodId) {
      selectedPayment = methodId;
      $$('#payment-methods label').forEach(label => {
        const input = label.querySelector('input');
        label.classList.toggle('border-pink-500', input.value === methodId);
        label.classList.toggle('bg-pink-50', input.value === methodId);
        label.classList.toggle('border-gray-200', input.value !== methodId);
      });
      $('#card-fields').classList.toggle('hidden', methodId !== 'card');
    }

    function placeOrder() {
      const form = $('#shipping-form');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const user = Auth.getCurrentUser();
      if (!user) {
        showToast('Debes iniciar sesión para completar tu compra', 'warning');
        setTimeout(() => navigateTo('login.html'), 1000);
        return;
      }

      const items = Cart.getDetailedItems();
      const subtotal = Cart.getSubtotal();
      const shippingMethod = MOCK_DATA.shippingMethods.find(m => m.id === selectedShipping);
      const shipping = shippingMethod ? shippingMethod.price : 0;
      const total = subtotal + shipping;

      const order = {
        id: `ORD-2026-${String(MOCK_DATA.orders.length + 1).padStart(3, '0')}`,
        userId: user.id,
        items: items.map(item => ({
          productId: item.product.id,
          name: item.product.name,
          price: item.product.price,
          quantity: item.quantity,
          image: item.product.image
        })),
        subtotal,
        shipping,
        total,
        status: 'processing',
        date: new Date().toISOString().split('T')[0],
        shippingAddress: {
          name: $('#ship-name').value,
          phone: $('#ship-phone').value,
          street: $('#ship-street').value,
          city: $('#ship-city').value,
          state: $('#ship-state').value,
          zipCode: $('#ship-zip').value,
          country: 'México'
        },
        shippingMethod: selectedShipping,
        paymentMethod: selectedPayment
      };

      MOCK_DATA.orders.push(order);
      localStorage.setItem('last_order', JSON.stringify(order));
      Cart.clear();

      showToast('¡Compra realizada con éxito!', 'success');
      setTimeout(() => navigateTo('order-confirmation.html'), 1000);
    }
  </script>
</body>
</html>
