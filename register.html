<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Dulce Tentación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
<meta name="currency" content="CLP">
</head>
<body class="bg-[#FFF9F5]">
  <div id="header-placeholder"></div>

  <section class="py-12">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-8">
          <span class="text-4xl">🍦</span>
          <h1 class="text-2xl font-bold text-gray-800 mt-2">Crear Cuenta</h1>
          <p class="text-gray-500 text-sm mt-1">Únete a la familia Dulce Tentación</p>
        </div>

        <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
            <input type="text" id="reg-name" required placeholder="Tu nombre completo" class="w-full px-4 py-2 rounded-lg border border-gray-200">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
            <input type="email" id="reg-email" required placeholder="tu@email.com" class="w-full px-4 py-2 rounded-lg border border-gray-200">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
            <input type="tel" id="reg-phone" placeholder="55 1234 5678" class="w-full px-4 py-2 rounded-lg border border-gray-200">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" id="reg-password" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-4 py-2 rounded-lg border border-gray-200" oninput="checkPasswordStrength(this.value)">
            <div class="mt-2">
              <div class="flex gap-1">
                <div id="str-1" class="h-1 flex-1 rounded-full bg-gray-200"></div>
                <div id="str-2" class="h-1 flex-1 rounded-full bg-gray-200"></div>
                <div id="str-3" class="h-1 flex-1 rounded-full bg-gray-200"></div>
                <div id="str-4" class="h-1 flex-1 rounded-full bg-gray-200"></div>
              </div>
              <p id="str-text" class="text-xs text-gray-500 mt-1"></p>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
            <input type="password" id="reg-password-confirm" required placeholder="Repite tu contraseña" class="w-full px-4 py-2 rounded-lg border border-gray-200">
          </div>
          <div class="flex items-start gap-2">
            <input type="checkbox" id="reg-terms" required class="mt-1 text-pink-500">
            <label for="reg-terms" class="text-sm text-gray-600">Acepto los <a href="terms.html" class="text-pink-500 hover:underline">términos y condiciones</a> y las <a href="privacy.html" class="text-pink-500 hover:underline">políticas de privacidad</a></label>
          </div>
          <button type="submit" class="btn-primary w-full py-3 text-white rounded-lg font-semibold">
            Crear Cuenta
          </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
          ¿Ya tienes cuenta? <a href="login.html" class="text-pink-500 font-medium hover:underline">Inicia sesión</a>
        </p>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script>
    function checkPasswordStrength(password) {
      let strength = 0;
      if (password.length >= 6) strength++;
      if (password.length >= 8) strength++;
      if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
      if (/[0-9]/.test(password) || /[^A-Za-z0-9]/.test(password)) strength++;

      const colors = ['bg-gray-200', 'bg-red-400', 'bg-yellow-400', 'bg-blue-400', 'bg-green-400'];
      const texts = ['', 'Débil', 'Regular', 'Buena', 'Fuerte'];

      for (let i = 1; i <= 4; i++) {
        const bar = $(`#str-${i}`);
        bar.className = `h-1 flex-1 rounded-full ${i <= strength ? colors[strength] : 'bg-gray-200'}`;
      }
      $('#str-text').textContent = texts[strength];
    }

    function handleRegister(event) {
      event.preventDefault();

      const name = $('#reg-name').value.trim();
      const email = $('#reg-email').value.trim();
      const phone = $('#reg-phone').value.trim();
      const password = $('#reg-password').value;
      const passwordConfirm = $('#reg-password-confirm').value;

      if (password !== passwordConfirm) {
        showToast('Las contraseñas no coinciden', 'error');
        return;
      }

      const result = Auth.register(name, email, password, phone);
      if (result.success) {
        showToast(result.message, 'success');
        setTimeout(() => navigateTo('index.html'), 1500);
      } else {
        showToast(result.message, 'error');
      }
    }
  </script>
</body>
</html>
