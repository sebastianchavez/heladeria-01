<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Dulce Tentación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-[#FFF9F5]">
  <div id="header-placeholder"></div>

  <section class="py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-8">Mi Perfil</h1>
      <div id="profile-content"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth()) return;

      const user = Auth.getCurrentUser();
      const userOrders = MOCK_DATA.orders.filter(o => o.userId === user.id);

      $('#profile-content').innerHTML = `
        <div class="grid lg:grid-cols-4 gap-8">
          <div class="lg:col-span-1">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
              <div class="text-center">
                <div class="w-20 h-20 bg-gradient-to-r from-pink-500 to-purple-500 rounded-full flex items-center justify-center text-white text-3xl font-bold mx-auto mb-4">${user.name.charAt(0)}</div>
                <h2 class="font-bold text-gray-800 text-lg">${user.name}</h2>
                <p class="text-gray-500 text-sm">${user.email}</p>
                ${user.phone ? `<p class="text-gray-500 text-sm">${user.phone}</p>` : ''}
              </div>
              <div class="mt-6 space-y-2">
                <a href="profile.html" class="flex items-center gap-3 px-4 py-2 rounded-lg bg-pink-50 text-pink-500 font-medium">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                  Mis Pedidos
                </a>
                <button onclick="Auth.logout()" class="flex items-center gap-3 px-4 py-2 rounded-lg text-red-500 hover:bg-red-50 w-full transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                  Cerrar Sesión
                </button>
              </div>
            </div>
          </div>

          <div class="lg:col-span-3">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100">
              <div class="p-6 border-b border-gray-100">
                <h2 class="text-xl font-bold text-gray-800">Historial de Pedidos</h2>
              </div>
              ${userOrders.length > 0 ? `
                <div class="divide-y divide-gray-100">
                  ${userOrders.map(order => `
                    <div class="p-6 hover:bg-gray-50 transition-colors">
                      <div class="flex flex-wrap items-center justify-between gap-4 mb-3">
                        <div>
                          <a href="order-detail.html?id=${order.id}" class="font-bold text-gray-800 hover:text-pink-500 transition-colors">${order.id}</a>
                          <p class="text-sm text-gray-500">${order.date}</p>
                        </div>
                        <div class="flex items-center gap-3">
                          ${getStatusBadge(order.status)}
                          <span class="font-bold text-gray-800">${formatPrice(order.total)}</span>
                        </div>
                      </div>
                      <div class="flex items-center gap-2 mb-3">
                        ${order.items.slice(0, 4).map(item => `
                          <img src="${item.image}" alt="${item.name}" class="w-10 h-10 rounded-lg object-cover border border-gray-200">
                        `).join('')}
                        ${order.items.length > 4 ? `<span class="text-sm text-gray-500">+${order.items.length - 4} más</span>` : ''}
                      </div>
                      <div class="flex items-center gap-3">
                        <a href="order-detail.html?id=${order.id}" class="text-sm text-pink-500 font-medium hover:underline">Ver detalle</a>
                        ${order.status === 'delivered' ? `
                          <span class="text-gray-300">|</span>
                          <a href="review.html?orderId=${order.id}" class="text-sm text-pink-500 font-medium hover:underline">Escribir reseña</a>
                        ` : ''}
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="p-12 text-center">
                  <span class="text-5xl">📦</span>
                  <p class="text-gray-500 mt-4">Aún no tienes pedidos</p>
                  <a href="products.html" class="btn-primary inline-block mt-4 px-6 py-2 text-white rounded-lg">Ver Productos</a>
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
