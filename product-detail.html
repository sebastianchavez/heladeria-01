<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - Dulce Tentación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-[#FFF9F5]">
  <div id="header-placeholder"></div>

  <section class="py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <nav class="flex items-center gap-2 text-sm text-gray-500 mb-8">
        <a href="index.html" class="hover:text-pink-500">Inicio</a>
        <span>/</span>
        <a href="products.html" class="hover:text-pink-500">Productos</a>
        <span>/</span>
        <span class="text-gray-800" id="breadcrumb-name">Producto</span>
      </nav>

      <div id="product-content"></div>
    </div>
  </section>

  <section class="py-12 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-8">Productos Relacionados</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="related-grid"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const productId = getUrlParam('id');
      const product = Products.getById(productId);

      if (!product) {
        $('#product-content').innerHTML = `
          <div class="text-center py-12">
            <span class="text-6xl">🔍</span>
            <p class="text-gray-500 mt-4 text-lg">Producto no encontrado</p>
            <a href="products.html" class="btn-primary inline-block mt-4 px-6 py-2 text-white rounded-lg">Volver a productos</a>
          </div>
        `;
        return;
      }

      $('#breadcrumb-name').textContent = product.name;
      document.title = `${product.name} - Dulce Tentación`;

      const reviews = Products.getReviews(productId);
      const related = Products.getByCategory(product.categoryId).filter(p => p.id !== product.id).slice(0, 4);

      const discount = product.originalPrice
        ? Math.round((1 - product.price / product.originalPrice) * 100)
        : 0;

      $('#product-content').innerHTML = `
        <div class="grid lg:grid-cols-2 gap-12">
          <div>
            <div class="relative">
              <img id="main-image" src="${product.images ? product.images[0] : product.image}" alt="${product.name}" class="w-full rounded-2xl shadow-lg object-cover aspect-square">
              ${discount > 0 ? `<span class="absolute top-4 left-4 bg-red-500 text-white text-sm font-bold px-3 py-1 rounded-full">-${discount}%</span>` : ''}
              ${product.bestSeller ? `<span class="absolute top-4 right-4 bg-yellow-400 text-yellow-900 text-sm font-bold px-3 py-1 rounded-full">⭐ Best Seller</span>` : ''}
            </div>
            ${product.images && product.images.length > 1 ? `
              <div class="flex gap-3 mt-4">
                ${product.images.map((img, i) => `
                  <button onclick="document.getElementById('main-image').src='${img}'" class="w-20 h-20 rounded-lg overflow-hidden border-2 ${i === 0 ? 'border-pink-500' : 'border-gray-200'} hover:border-pink-500 transition-colors">
                    <img src="${img}" alt="" class="w-full h-full object-cover">
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </div>

          <div>
            <span class="inline-block px-3 py-1 bg-pink-100 text-pink-600 rounded-full text-sm font-medium mb-3">${product.category}</span>
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-3">${product.name}</h1>

            <div class="flex items-center gap-3 mb-4">
              <div class="flex items-center gap-1">
                ${generateStars(product.rating)}
              </div>
              <span class="text-gray-500">(${product.reviewCount} reseñas)</span>
            </div>

            <div class="flex items-center gap-3 mb-6">
              <span class="text-3xl font-bold text-gray-800">${formatPrice(product.price)}</span>
              ${product.originalPrice ? `<span class="text-xl text-gray-400 line-through">${formatPrice(product.originalPrice)}</span>` : ''}
            </div>

            <p class="text-gray-600 mb-6 leading-relaxed">${product.description}</p>

            ${product.ingredients ? `
              <div class="mb-6">
                <h3 class="font-bold text-gray-800 mb-2">Ingredientes</h3>
                <div class="flex flex-wrap gap-2">
                  ${product.ingredients.map(ing => `<span class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-sm">${ing}</span>`).join('')}
                </div>
              </div>
            ` : ''}

            <div class="flex items-center gap-4 mb-6">
              <div class="flex items-center border border-gray-200 rounded-lg">
                <button onclick="updateQuantity(-1)" class="px-4 py-2 text-gray-600 hover:text-pink-500 transition-colors">-</button>
                <input type="number" id="quantity" value="1" min="1" class="w-16 text-center border-x border-gray-200 py-2 focus:outline-none">
                <button onclick="updateQuantity(1)" class="px-4 py-2 text-gray-600 hover:text-pink-500 transition-colors">+</button>
              </div>
              <button onclick="addToCart()" class="btn-primary flex-1 px-8 py-3 text-white rounded-lg font-semibold flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
                Agregar al Carrito
              </button>
            </div>

            <div class="border-t border-gray-200 pt-6 space-y-3">
              <div class="flex items-center gap-3 text-gray-600">
                <span class="text-green-500">✓</span>
                <span>${product.inStock ? 'En stock' : 'Agotado'}</span>
              </div>
              <div class="flex items-center gap-3 text-gray-600">
                <span class="text-green-500">✓</span>
                <span>Envío a todo el país</span>
              </div>
              <div class="flex items-center gap-3 text-gray-600">
                <span class="text-green-500">✓</span>
                <span>Ingredientes 100% naturales</span>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-16">
          <h2 class="text-2xl font-bold text-gray-800 mb-6">Reseñas de Clientes</h2>

          ${Auth.getCurrentUser() ? `
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-8">
              <h3 class="font-bold text-gray-800 mb-4">Escribe tu reseña</h3>
              <div class="flex items-center gap-1 mb-4" id="review-stars">
                ${[1,2,3,4,5].map(i => `<button type="button" class="star-btn text-3xl cursor-pointer transition-transform hover:scale-125 text-gray-300" data-rating="${i}">★</button>`).join('')}
              </div>
              <textarea id="review-comment" rows="3" placeholder="Cuéntanos tu experiencia con este producto..." class="w-full px-4 py-2 rounded-lg border border-gray-200 mb-4 resize-none"></textarea>
              <button onclick="submitReview(${product.id})" class="btn-primary px-6 py-2 text-white rounded-lg font-medium">
                Enviar Reseña
              </button>
            </div>
          ` : `
            <div class="bg-pink-50 rounded-2xl p-6 mb-8 text-center">
              <p class="text-gray-600 mb-3">Inicia sesión para escribir una reseña</p>
              <a href="login.html" class="btn-primary inline-block px-6 py-2 text-white rounded-lg font-medium">Iniciar Sesión</a>
            </div>
          `}

          <div class="space-y-4" id="reviews-list">
            ${reviews.length > 0 ? reviews.map(r => `
              <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-pink-500 to-purple-500 rounded-full flex items-center justify-center text-white font-bold">${r.userName.charAt(0)}</div>
                    <div>
                      <p class="font-semibold text-gray-800">${r.userName}</p>
                      <p class="text-sm text-gray-500">${r.date}</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-1">
                    ${generateStars(r.rating)}
                  </div>
                </div>
                <p class="text-gray-600">${r.comment}</p>
              </div>
            `).join('') : '<p class="text-gray-500 text-center py-8">Aún no hay reseñas. ¡Sé el primero!</p>'}
          </div>
        </div>
      `;

      Products.renderGrid(related, 'related-grid');

      if (Auth.getCurrentUser()) {
        let selectedRating = 0;
        $$('.star-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedRating = parseInt(btn.dataset.rating);
            $$('.star-btn').forEach((b, i) => {
              b.classList.toggle('text-yellow-400', i < selectedRating);
              b.classList.toggle('text-gray-300', i >= selectedRating);
            });
          });
        });

        window.submitReview = function(productId) {
          if (selectedRating === 0) {
            showToast('Por favor selecciona una calificación', 'warning');
            return;
          }
          const comment = $('#review-comment').value.trim();
          if (!comment) {
            showToast('Por favor escribe un comentario', 'warning');
            return;
          }
          const user = Auth.getCurrentUser();
          Products.addReview(productId, user.id, selectedRating, comment);
          showToast('¡Reseña enviada! Gracias por tu opinión', 'success');
          setTimeout(() => location.reload(), 1000);
        };
      }
    });

    function updateQuantity(delta) {
      const input = $('#quantity');
      let val = parseInt(input.value) + delta;
      if (val < 1) val = 1;
      input.value = val;
    }

    function addToCart() {
      const productId = parseInt(getUrlParam('id'));
      const quantity = parseInt($('#quantity').value);
      Cart.add(productId, quantity);
    }
  </script>
</body>
</html>
