<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Dulce Tentación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
<meta name="currency" content="CLP">
</head>
<body class="bg-[#FFF9F5]">
  <div id="header-placeholder"></div>

  <section class="py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-8">Mi Carrito</h1>
      <div id="cart-content"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderCart);

    function renderCart() {
      const items = Cart.getDetailedItems();
      const container = $('#cart-content');

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16">
            <span class="text-6xl">🛒</span>
            <h2 class="text-2xl font-bold text-gray-800 mt-4 mb-2">Tu carrito está vacío</h2>
            <p class="text-gray-500 mb-6">Agrega productos para comenzar tu pedido</p>
            <a href="products.html" class="btn-primary inline-block px-8 py-3 text-white rounded-full font-semibold">
              Ver Productos
            </a>
          </div>
        `;
        return;
      }

      const subtotal = Cart.getSubtotal();
      const shipping = subtotal >= 20000 ? 0 : 5000;
      const total = subtotal + shipping;

      container.innerHTML = `
        <div class="grid lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2 space-y-4">
            ${items.map(item => `
              <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex gap-4">
                <img src="${item.product.image}" alt="${item.product.name}" class="w-24 h-24 rounded-xl object-cover flex-shrink-0">
                <div class="flex-1 min-w-0">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <a href="product-detail.html?id=${item.product.id}" class="font-bold text-gray-800 hover:text-pink-500 transition-colors">${item.product.name}</a>
                      <p class="text-sm text-gray-500">${item.product.category}</p>
                    </div>
                    <button onclick="Cart.remove(${item.product.id}); renderCart();" class="text-gray-400 hover:text-red-500 transition-colors p-1">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                  </div>
                  <div class="flex items-center justify-between mt-3">
                    <div class="flex items-center border border-gray-200 rounded-lg">
                      <button onclick="updateQty(${item.product.id}, -1)" class="px-3 py-1 text-gray-600 hover:text-pink-500">-</button>
                      <span class="px-3 py-1 border-x border-gray-200 font-medium">${item.quantity}</span>
                      <button onclick="updateQty(${item.product.id}, 1)" class="px-3 py-1 text-gray-600 hover:text-pink-500">+</button>
                    </div>
                    <span class="font-bold text-gray-800">${formatPrice(item.product.price * item.quantity)}</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>

          <div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 sticky top-20">
              <h3 class="font-bold text-gray-800 text-lg mb-4">Resumen del Pedido</h3>
              <div class="space-y-3 mb-4">
                <div class="flex justify-between text-gray-600">
                  <span>Subtotal</span>
                  <span>${formatPrice(subtotal)}</span>
                </div>
                <div class="flex justify-between text-gray-600">
                  <span>Envío</span>
                  <span>${shipping === 0 ? '<span class="text-green-500 font-medium">Gratis</span>' : formatPrice(shipping)}</span>
                </div>
                ${shipping > 0 ? `<p class="text-xs text-pink-500">¡Envío gratis en compras mayores a $20.000!</p>` : ''}
                <div class="border-t border-gray-200 pt-3 flex justify-between font-bold text-lg text-gray-800">
                  <span>Total</span>
                  <span>${formatPrice(total)}</span>
                </div>
              </div>
              <div class="mb-4">
                <div class="flex gap-2">
                  <input type="text" placeholder="Cupón de descuento" class="flex-1 px-4 py-2 rounded-lg border border-gray-200 text-sm">
                  <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">Aplicar</button>
                </div>
              </div>
              <a href="checkout.html" class="btn-primary block text-center py-3 text-white rounded-lg font-semibold">
                Proceder al Pago
              </a>
              <a href="products.html" class="block text-center mt-3 text-gray-500 hover:text-pink-500 text-sm font-medium transition-colors">
                Seguir Comprando
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function updateQty(productId, delta) {
      const items = Cart.getItems();
      const item = items.find(i => i.productId === productId);
      if (item) {
        const newQty = item.quantity + delta;
        if (newQty <= 0) {
          Cart.remove(productId);
        } else {
          Cart.updateQuantity(productId, newQty);
        }
        renderCart();
      }
    }
  </script>
</body>
</html>
