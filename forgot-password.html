<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Dulce Tentación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
<meta name="currency" content="CLP">
</head>
<body class="bg-[#FFF9F5]">
  <div id="header-placeholder"></div>

  <section class="py-12">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
          </div>
          <h1 class="text-2xl font-bold text-gray-800">Recuperar Contraseña</h1>
          <p class="text-gray-500 text-sm mt-2">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña</p>
        </div>

        <form id="forgot-form" class="space-y-4" onsubmit="handleForgot(event)">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
            <input type="email" id="forgot-email" required placeholder="tu@email.com" class="w-full px-4 py-2 rounded-lg border border-gray-200">
          </div>
          <button type="submit" class="btn-primary w-full py-3 text-white rounded-lg font-semibold">
            Enviar Enlace de Recuperación
          </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
          ¿Recordaste tu contraseña? <a href="login.html" class="text-pink-500 font-medium hover:underline">Inicia sesión</a>
        </p>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script>
    function handleForgot(event) {
      event.preventDefault();
      const email = $('#forgot-email').value.trim();

      const result = Auth.recoverPassword(email);
      if (result.success) {
        showToast(result.message, 'success');
        setTimeout(() => navigateTo('login.html'), 2000);
      } else {
        showToast(result.message, 'error');
      }
    }
  </script>
</body>
</html>
