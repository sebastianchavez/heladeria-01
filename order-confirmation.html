<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Compra - Dulce Tentación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-[#FFF9F5]">
  <div id="header-placeholder"></div>

  <section class="py-12">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
      <div id="confirmation-content"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const order = JSON.parse(localStorage.getItem('last_order'));

      if (!order) {
        $('#confirmation-content').innerHTML = `
          <div class="text-center py-16">
            <span class="text-6xl">🔍</span>
            <h2 class="text-2xl font-bold text-gray-800 mt-4 mb-2">No hay orden reciente</h2>
            <a href="index.html" class="btn-primary inline-block mt-4 px-8 py-3 text-white rounded-full font-semibold">Ir al Inicio</a>
          </div>
        `;
        return;
      }

      const shippingMethod = MOCK_DATA.shippingMethods.find(m => m.id === order.shippingMethod);
      const paymentMethod = MOCK_DATA.paymentMethods.find(m => m.id === order.paymentMethod);

      $('#confirmation-content').innerHTML = `
        <div class="text-center mb-8 print-only">
          <span class="text-3xl">🍦</span>
          <h1 class="text-2xl font-bold text-gray-800">Dulce Tentación</h1>
        </div>

        <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100 text-center mb-8">
          <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          </div>
          <h1 class="text-3xl font-bold text-gray-800 mb-2">¡Compra Exitosa!</h1>
          <p class="text-gray-600 mb-4">Tu pedido ha sido confirmado y está siendo procesado</p>
          <div class="inline-block bg-gray-100 px-6 py-3 rounded-xl">
            <p class="text-sm text-gray-500">Número de pedido</p>
            <p class="text-xl font-bold text-gray-800">${order.id}</p>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-6" id="printable-receipt">
          <h2 class="text-xl font-bold text-gray-800 mb-4">Detalle del Pedido</h2>

          <div class="space-y-3 mb-6">
            ${order.items.map(item => `
              <div class="flex items-center gap-3 py-2 border-b border-gray-100 last:border-0">
                <img src="${item.image}" alt="${item.name}" class="w-12 h-12 rounded-lg object-cover">
                <div class="flex-1">
                  <p class="font-medium text-gray-800">${item.name}</p>
                  <p class="text-sm text-gray-500">Cantidad: ${item.quantity}</p>
                </div>
                <span class="font-medium text-gray-800">${formatPrice(item.price * item.quantity)}</span>
              </div>
            `).join('')}
          </div>

          <div class="border-t border-gray-200 pt-4 space-y-2">
            <div class="flex justify-between text-gray-600">
              <span>Subtotal</span>
              <span>${formatPrice(order.subtotal)}</span>
            </div>
            <div class="flex justify-between text-gray-600">
              <span>Envío (${shippingMethod ? shippingMethod.name : 'Estándar'})</span>
              <span>${order.shipping === 0 ? 'Gratis' : formatPrice(order.shipping)}</span>
            </div>
            <div class="flex justify-between font-bold text-lg text-gray-800 pt-2 border-t border-gray-200">
              <span>Total</span>
              <span>${formatPrice(order.total)}</span>
            </div>
          </div>

          <div class="grid sm:grid-cols-2 gap-4 mt-6 pt-6 border-t border-gray-200">
            <div>
              <h3 class="font-medium text-gray-800 mb-1">Dirección de envío</h3>
              <p class="text-sm text-gray-600">${order.shippingAddress.street}</p>
              <p class="text-sm text-gray-600">${order.shippingAddress.city}, ${order.shippingAddress.state}</p>
              <p class="text-sm text-gray-600">CP: ${order.shippingAddress.zipCode}</p>
            </div>
            <div>
              <h3 class="font-medium text-gray-800 mb-1">Método de pago</h3>
              <p class="text-sm text-gray-600">${paymentMethod ? paymentMethod.icon + ' ' + paymentMethod.name : 'Tarjeta'}</p>
              <h3 class="font-medium text-gray-800 mb-1 mt-3">Fecha</h3>
              <p class="text-sm text-gray-600">${order.date}</p>
            </div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center no-print">
          <button onclick="window.print()" class="px-8 py-3 border-2 border-pink-500 text-pink-500 rounded-full font-semibold hover:bg-pink-50 transition-colors flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            Imprimir Comprobante
          </button>
          <a href="profile.html" class="btn-primary px-8 py-3 text-white rounded-full font-semibold flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            Ver Historial de Pedidos
          </a>
        </div>
        <div class="text-center mt-4 no-print">
          <a href="products.html" class="text-pink-500 font-medium hover:underline">Seguir Comprando</a>
        </div>
      `;
    });
  </script>
</body>
</html>
